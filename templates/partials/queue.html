{% for inc in incidents %}
<tr class="border-b border-gray-800/40 hover:bg-white/5 transition-colors">
    <td class="py-2 text-gray-500">{{ inc[1] }}</td>
    <td class="text-blue-400 font-bold">{{ inc[2] }}</td>
    <td class="truncate max-w-xs italic">{{ inc[8] }}</td>
    <td class="flex gap-2">
        <button hx-post="/pardon" hx-vals='{"ip": "{{ inc[2] }}"}' hx-swap="outerHTML" class="text-red-500 underline">[PARDON]</button>
        <button hx-post="/get-forensics" hx-vals='{"path": "{{ inc[6] }}"}' hx-target="#forensic-slate" class="text-green-500 underline">[LOGS]</button>
    </td>
</tr>
{% endfor %}
